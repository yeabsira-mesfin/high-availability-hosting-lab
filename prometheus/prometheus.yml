global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: application
    metrics_path: /metrics
    static_configs:
      - targets: ['app1:5000', 'app2:5000']
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
